<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing - BAZZ BUG PANEL</title>
    <link rel="stylesheet" href="/css/style.css?v=20260910-1">
</head>

<body>
    <div class="pricing-shell">
        <div class="pricing-wrap">
            <header class="pricing-header">
                <div class="pricing-hero glass">
                    <div class="pricing-hero-badge" id="pricing-badge">Premium access</div>
                    <div class="pricing-hero-body">
                        <div class="brand pricing-brand">
                            <span class="icon" id="brand-icon"></span>
                            <h1 id="brand-title" class="brand-wordmark brand-wordmark-pricing">BAZZBUGPANEL</h1>
                        </div>
                        <div class="pricing-hero-copy">
                            <h2>Enter the BAZZ inner circle.</h2>
                            <p id="brand-subtitle">Welcome to BAZZ BUG PANEL</p>
                        </div>
                    </div>
                    <div class="pricing-hero-meta">
                        <span>Private access</span>
                        <span>Priority support</span>
                        <span>Curated tiers</span>
                    </div>
                </div>
            </header>

            <div id="pricing-root" class="pricing-grid"></div>

            <div class="pricing-footer">
                <p>Owner: <a id="owner-link" href="#" target="_blank" rel="noopener">@BazzHacker963</a></p>
                <p><a href="/index.html">Login</a> · <a id="channel-link" href="#" target="_blank"
                        rel="noopener">Telegram Channel</a></p>
            </div>
        </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js?v=20260910-1"></script>
    <script>
        async function renderPricing() {
            const brand = await loadBranding() || window.__BRAND__ || {};
            const brandTitle = document.getElementById("brand-title");
            const brandSubtitle = document.getElementById("brand-subtitle");
            const brandIcon = document.getElementById("brand-icon");
            const paymentRoot = document.getElementById("pricing-root");
            document.getElementById("channel-link").href = brand.telegramChannel || "#";
            document.getElementById("owner-link").href = brand.telegramOwnerContact || "#";

            if (brand.webName) brandTitle.textContent = brand.webName;
            if (brand.webSubtitle) brandSubtitle.textContent = brand.webSubtitle;
            if (brand.pricingBadge) document.getElementById("pricing-badge").textContent = brand.pricingBadge;
            if (brand.logoPhoto) {
                brandIcon.innerHTML = `<img class="brand-photo splash-photo" src="${brand.logoPhoto}" alt="${brand.webName || 'BAZZBUGPANEL'} logo">`;
            }

            let pricing = { plans: {} };
            try {
                const data = await api('/system/pricing');
                pricing = data.pricing || pricing;
            } catch (error) {
                console.warn('Failed to load pricing', error);
            }

            const planGroups = [
                { key: 'PREMIUM', title: 'Premium', note: 'Two access terms' },
                { key: 'VVIP', title: 'VVIP Premium', note: 'Lifetime access' },
                { key: 'OWNER', title: 'Owner', note: 'Lifetime access' },
            ];

            const cards = planGroups.map(({ key, title, note }) => {
                const plans = (pricing.plans && pricing.plans[key]) || [];
                const rows = plans.length ? plans.map((plan) => `<li><span>${plan.label}</span><strong>$${Number(plan.price).toLocaleString('en-US')}</strong></li>`).join('') : `<li><span>Custom</span><strong>Contact owner</strong></li>`;
                const orderUrl = (brand.telegramOwnerContact || brand.telegramChannel || "/index.html");
                const label = `Order ${title}`;
                return `
                <article class="card pricing-card ${key === 'PREMIUM' ? 'featured' : ''}">
                    <span class="tag">${key}</span>
                    <h2>${title}</h2>
                    <div class="price"><strong>${plans[0] ? `$${Number(plans[0].price).toLocaleString('en-US')}` : 'Custom'}</strong><span>${note}</span></div>
                    <ul>${rows}</ul>
                    <button class="btn cta" type="button" data-order-link="${orderUrl}" data-order-label="${label}">${label}</button>
                </article>
            `;
            }).join('');

            paymentRoot.innerHTML = cards;
            paymentRoot.querySelectorAll('[data-order-link]').forEach((button) => {
                button.addEventListener('click', () => {
                    const href = button.dataset.orderLink;
                    if (href && /^https?:\/\//.test(href)) {
                        window.open(href, '_blank', 'noopener');
                        return;
                    }
                    if (href && href.startsWith('tg:')) {
                        window.location.href = href;
                        return;
                    }
                    window.location.href = '/index.html';
                });
            });

        }

        renderPricing();
    </script>
</body>

</html>
